<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OLED 표정 시뮬레이터</title>
<style>
:root{
  --bg:#f1f3f2; --panel:#ffffff; --ink:#15201f; --muted:#56655f; --line:#d3dad7;
  --btn:#e6ebe9; --btn-ink:#15201f; --on:#0c6b78; --on-ink:#ffffff; --focus:#0c6b78;
  --bezel:#0a0e0f; --pin:#8a9a95;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1413; --panel:#172120; --ink:#e6efed; --muted:#9db0aa; --line:#2b3a37;
    --btn:#223230; --btn-ink:#e6efed; --on:#27d3ee; --on-ink:#04171a; --focus:#27d3ee;
    --bezel:#050808; --pin:#74867f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1413; --panel:#172120; --ink:#e6efed; --muted:#9db0aa; --line:#2b3a37;
  --btn:#223230; --btn-ink:#e6efed; --on:#27d3ee; --on-ink:#04171a; --focus:#27d3ee;
  --bezel:#050808; --pin:#74867f;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%;
}
main{max-width:720px; margin:0 auto; padding:20px 16px 40px; display:flex; flex-direction:column; gap:20px}
h1{font-size:1.35rem; margin:0; letter-spacing:-0.01em}
.sub{margin:2px 0 0; color:var(--muted); font-size:.9rem}
h2{font-size:1rem; margin:0 0 10px}

.device{background:var(--bezel); border-radius:16px; padding:12px 12px 14px; box-shadow:0 0 0 1px var(--line)}
.pins{display:flex; justify-content:center; gap:18px; color:var(--pin); font:11px ui-monospace,Menlo,Consolas,monospace; padding:0 0 8px}
#oled{display:block; width:100%; height:auto; aspect-ratio:2/1; image-rendering:pixelated; border-radius:6px; touch-action:pan-y; cursor:crosshair}
.hint{color:var(--pin); font-size:.78rem; text-align:center; margin-top:8px}

section{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px}
button{font:inherit; color:var(--btn-ink); background:var(--btn); border:1px solid transparent; border-radius:10px; padding:10px 8px; cursor:pointer; min-height:44px}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
button[aria-pressed="true"]{background:var(--on); color:var(--on-ink); font-weight:700}

.row{display:flex; gap:8px}
input[type=text]{flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px}
.read{margin:8px 0 0; color:var(--muted); font-size:.88rem; min-height:1.4em}
.seg{display:flex; gap:8px; flex-wrap:wrap}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; align-items:center; gap:10px; min-height:32px}
.opt input{width:20px; height:20px; accent-color:var(--on)}
.opt .lbl{font-size:.92rem}
.group-title{font-size:.85rem; color:var(--muted); margin:0 0 6px}
details summary{cursor:pointer; font-weight:600; min-height:32px}
textarea{width:100%; height:260px; margin-top:10px; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; resize:vertical}
.note{color:var(--muted); font-size:.82rem; margin:8px 0 0}
</style>
</head>
<body>
<main>
  <header>
    <h1>OLED 표정 시뮬레이터</h1>
    <p class="sub">128×64 픽셀 · SSD1306 · 감정 8종 · <span id="ver"></span></p>
  </header>

  <div class="device">
    <div class="pins" aria-hidden="true"><span>GND</span><span>VDD</span><span>SCL</span><span>SDA</span></div>
    <canvas id="oled" width="768" height="384" role="img" aria-label="OLED 화면 시뮬레이션"></canvas>
    <div class="hint">화면 위로 손가락이나 마우스를 움직이면 눈이 따라갑니다</div>
  </div>

  <section>
    <h2>대화로 표정 바꾸기</h2>
    <div class="row">
      <input type="text" id="msg" placeholder="예: 오늘 정말 기뻐요" autocomplete="off" enterkeyhint="send">
      <button id="send" type="button">보내기</button>
    </div>
    <button type="button" id="mic" aria-pressed="false" style="width:100%;margin-top:8px">🎤 말하기</button>
    <div class="opts" style="margin-top:10px">
      <label class="opt"><input type="checkbox" id="optSpeak" checked><span class="lbl">🔊 감정에 맞게 소리 내어 대답하기</span></label>
    </div>
    <p class="read" id="read" aria-live="polite">글을 입력하거나 마이크로 말하면 감정 단어를 찾아 표정을 바꿉니다.</p>
  </section>

  <section>
    <h2>화면 설정</h2>
    <p class="group-title">화면 색상</p>
    <div class="seg" id="colors">
      <button type="button" data-c="dual" aria-pressed="true">2색 (상단 노랑)</button>
      <button type="button" data-c="cyan" aria-pressed="false">단색 청록</button>
      <button type="button" data-c="white" aria-pressed="false">단색 흰색</button>
    </div>
    <div class="opts" style="margin-top:14px">
      <label class="opt"><input type="checkbox" id="optGrid" checked><span class="lbl">픽셀 격자 표시</span></label>
      <label class="opt"><input type="checkbox" id="optAuto" checked><span class="lbl">눈 깜빡임·시선 자동 동작</span></label>
      <label class="opt"><input type="checkbox" id="optTalk"><span class="lbl">입 계속 움직이기 (말하는 중)</span></label>
    </div>
  </section>

  <section>
    <details>
      <summary>ESP32 이식용 표정 파라미터</summary>
      <p class="note">표정마다 눈 크기, 기울기, 입 모양을 정수·실수 값으로 정리한 표입니다. 이 표를 U8g2 또는 Adafruit_SSD1306 그리기 함수에 넣으면 같은 표정을 낼 수 있습니다.</p>
      <textarea id="exp" readonly spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button type="button" id="copy">복사</button></div>
      <p class="note" id="copyMsg" aria-live="polite"></p>
    </details>
  </section>
</main>

<script>
(function(){
  var W = 128, H = 64, S = 6;
  var HEADER_H = 16, EYE_Y = 35, MOUTH_Y = 56;

  var off = document.createElement('canvas');
  off.width = W; off.height = H;
  var g = off.getContext('2d', { willReadFrequently: true });
  var view = document.getElementById('oled');
  var v = view.getContext('2d');

  /* 표정 정의: 눈 종류(box/happy/heart/line)와 보간되는 숫자 값 */
  var DEF = { w:26, h:30, r:7, gap:20, tiltIn:0, tiltOut:0, mouthCurve:0, mouthW:8, mouthOpen:0, gx:0, gy:0, mx:0, hL:1 };
  function mk(o){ var n = {}; for (var k in DEF) n[k] = DEF[k]; for (var k2 in o) n[k2] = o[k2]; return n; }
  var E = {
    standby:   mk({ label:'Standby',   ko:'대기',   kind:'box' }),
    happy:     mk({ label:'Happy',     ko:'기쁨',   kind:'happy', w:26, h:0, r:0, gap:18, mouthCurve:1, mouthW:20 }),
    sad:       mk({ label:'Sad',       ko:'슬픔',   kind:'box', w:24, h:26, r:8, gap:22, tiltOut:11, mouthCurve:-1, mouthW:14, gy:2 }),
    angry:     mk({ label:'Angry',     ko:'화남',   kind:'box', w:26, h:24, r:5, gap:18, tiltIn:12, mouthCurve:-0.7, mouthW:18 }),
    surprised: mk({ label:'Surprised', ko:'놀람',   kind:'box', w:28, h:32, r:13, gap:18, mouthOpen:1, mouthW:10 }),
    sleepy:    mk({ label:'Sleepy',    ko:'졸림',   kind:'line', w:28, h:3, r:1, gap:18, mouthW:6, extra:'zzz' }),
    love:      mk({ label:'Love',      ko:'사랑',   kind:'heart', w:30, h:0, r:0, gap:14, mouthCurve:0.8, mouthW:16 }),
    thinking:  mk({ label:'Thinking',  ko:'생각',   kind:'box', w:24, h:28, r:7, gap:22, hL:0.7, gx:6, gy:-4, mx:8, extra:'dots' })
  };
  var ORDER = ['standby','happy','sad','angry','surprised','sleepy','love','thinking'];
  var KEYS = Object.keys(DEF);

  var cur = {}, kind = 'box', tgtName = 'standby', tgt = E.standby;
  KEYS.forEach(function(k){ cur[k] = E.standby[k]; });

  var trans = null, blink = null, nextBlink = 1500;
  var gaze = { x:0, y:0 }, gazeTgt = { x:0, y:0 }, nextGaze = 2000, hover = false;
  var talkUntil = 0;
  var colorMode = 'dual';

  var optGrid = document.getElementById('optGrid');
  var optAuto = document.getElementById('optAuto');
  var optTalk = document.getElementById('optTalk');

  /* ---------- 표정 바꾸기 ---------- */
  function setEmotion(name){
    if (name === tgtName) return;
    tgtName = name; tgt = E[name];
    if (tgt.kind !== kind) trans = { t0: performance.now(), swapped: false };
  }

  /* ---------- 대화 → 감정 ---------- */
  var RULES = [
    ['love',      /사랑|♥|❤|💕|😍|🥰|보고\s?싶|좋아해|좋아한|좋아했|반했|설레|두근|그리워|그립|안아\s?줘|뽀뽀|귀여워|귀엽|예뻐|예쁘/],
    ['angry',     /화나|화가|화났|짜증|싫|미워|밉|열받|빡치|빡쳐|억울|어이없|어이가\s?없|분해|분하|꺼져|닥쳐|시끄러|귀찮|젠장|너무해|😡|😠/],
    ['sad',       /슬프|슬퍼|슬픈|ㅠ|ㅜ|😢|😭|미안|죄송|힘들|힘든|힘드|우울|외로|외롭|서운|서러|속상|눈물|울었|울고|울컥|아프|아파(?!트)|실망|망했|괴로|쓸쓸|허전|안\s?좋(?!아해|아한|아했)|나빠|나쁘/],
    ['surprised', /헉|헐|놀라|놀랐|놀람|대박|우와|와우|깜짝|세상에|설마|어머(?!니|님)|말도\s?안\s?돼|믿을\s?수\s?없|진짜\?|정말\?|😮|😲/],
    ['sleepy',    /졸려|졸리|졸음|피곤|잘\s?자|(^|\s)자러|(^|\s)자야|(^|\s)자고\s?싶|잠\s?와|잠이\s?와|하품|꿀잠|굿나잇|지쳤|지친|녹초|😴/],
    ['thinking',  /^(음+|흠+)([\s.…?]|$)|글쎄|생각|고민|궁금|모르겠|헷갈|애매|어쩌지|어떡하지|어떻게\s?하지|뭐지|뭘까|🤔/],
    ['happy',     /기뻐|기쁘|기쁜|좋아|좋다|좋은|좋네|좋았|행복|고마|감사|ㅎㅎ|ㅋㅋ|하하|히히|헤헤|최고|반가|신나|신난|신났|즐거|즐겁|재밌|재미있|웃겨|웃기|잘했|축하|다행|야호|만세|짱|멋지|멋져|멋있|맛있|😊|😄|😁|👍/]
  ];
  var msg = document.getElementById('msg'), read = document.getElementById('read');
  /* 부정 표현: 키워드 바로 앞의 "안/못"(띄어쓰기 앞이거나 문장 처음) 또는 바로 뒤의 "~지 않/~지 마/~지 말/~지 못" */
  var NEG_BEFORE = /(^|[\s,.!?~…])(안|못)\s?$/;
  var NEG_AFTER  = /^[가-힣]{0,3}?(지는|지도|지|진)\s?(않|마|말|못)/;
  var lastNegated = [];
  function isNegated(text, start, end){
    return NEG_BEFORE.test(text.slice(Math.max(0, start - 6), start)) || NEG_AFTER.test(text.slice(end, end + 8));
  }
  function detect(text){
    lastNegated = [];
    for (var i = 0; i < RULES.length; i++) {
      var re = new RegExp(RULES[i][1].source, 'g'), m;
      while ((m = re.exec(text))) {
        if (!m[0]) { re.lastIndex++; continue; }
        var end = m.index + m[0].length;
        if (isNegated(text, m.index, end)) { lastNegated.push(m[0]); continue; } // 부정된 단어는 건너뛰고 다음 후보를 본다
        return RULES[i][0];
      }
    }
    return null;
  }
  /* AI 감정 판별: 같은 서버의 /api/emotion(server.py)에 물어보고, 실패하면 키워드 규칙으로 대체 */
  var aiSeq = 0;
  function detectAI(text, cb){
    var seq = ++aiSeq, done = false;
    function finish(emotion, how, why){
      if (done || seq !== aiSeq) return; // 더 새 문장이 들어왔으면 이전 결과는 버린다
      done = true; cb(emotion, how, why);
    }
    function fallback(why){
      var emo = detect(text) || 'standby';
      finish(emo, '키워드', lastNegated.length ? '부정 표현 제외: ' + lastNegated.join(', ') : '');
    }
    // 파일로 열었거나 GitHub Pages처럼 server.py가 없는 곳이면 바로 키워드 방식
    if (!window.fetch || location.protocol === 'file:' || /\.github\.io$/.test(location.hostname)) { fallback('AI 서버 없음'); return; }
    var timer = setTimeout(function(){ fallback('AI 응답 지연'); }, 8000);
    fetch('/api/emotion', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text }) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        clearTimeout(timer);
        if (res.ok && E[res.j.emotion]) finish(res.j.emotion, 'AI', res.j.reason);
        else fallback(res.j && res.j.error ? res.j.error : 'AI 실패');
      })
      .catch(function(){ clearTimeout(timer); fallback('AI 서버 연결 실패'); });
  }
  function showResult(text, emotion, how, why){
    read.textContent = '“' + text + '” → ' + E[emotion].ko + ' (' + E[emotion].label + ') · ' + how + (why ? ' · ' + why : '');
    setEmotion(emotion);
    talkUntil = performance.now() + 1500;
    reply(emotion, text);
  }

  /* ---------- 소리 내어 대답하기 (브라우저 음성 합성, ko-KR) ---------- */
  var REPLIES = {
    standby:   ['그렇구나.', '아하, 그랬어?', '오, 그래서?', '더 얘기해 줘.', '응, 계속 말해 봐.', '그랬구나, 재밌다.',
                '오호, 처음 듣는 얘기야.', '그래서 어떻게 됐어?', '음, 알겠어.', '나도 궁금하다, 더 들려줘.', '오케이!', '그렇군, 그렇군.'],
    happy:     ['와, 나도 기뻐!', '좋다! 신난다!', '헤헤, 기분 좋아.', '잘됐다! 축하해!', '나까지 웃음이 나네.', '최고야!',
                '오늘 좋은 날이다!', '와아, 멋지다!'],
    sad:       ['에구, 속상하겠다.', '괜찮아, 내가 옆에 있을게.', '많이 힘들었구나.', '토닥토닥.', '울고 싶으면 울어도 돼.',
                '다음엔 꼭 잘될 거야.', '오늘은 푹 쉬자.', '마음이 아프다.'],
    angry:     ['정말 화날 만하다!', '으, 나도 짜증 나!', '후우, 진정하자.', '그건 너무했다!', '숨 한번 크게 쉬자.',
                '내가 대신 화내 줄게!', '진짜 열받겠다.', '괜찮아, 네 잘못 아니야.'],
    surprised: ['헉, 진짜?', '우와, 깜짝이야!', '세상에, 정말?', '말도 안 돼!', '어머나!', '대박이다!', '설마, 진짜로?', '와, 놀랐어!'],
    sleepy:    ['나도 졸려… 하암.', '푹 자, 잘 자.', '우리 좀 쉬자.', '좋은 꿈 꿔.', '눈이 감긴다….', '오늘 고생 많았어.',
                '따뜻하게 자.', '내일 또 얘기하자.'],
    love:      ['나도 너 좋아!', '헤헤, 부끄러워.', '사랑해!', '두근두근!', '나도 보고 싶었어.', '너밖에 없어.', '고마워, 감동이야.', '하트 뿅뿅!'],
    thinking:  ['음… 같이 생각해 보자.', '글쎄, 어떨까?', '흠, 궁금하네.', '어려운 문제다.', '잠깐만, 생각 좀 해 볼게.',
                '천천히 고민해 봐.', '나도 잘 모르겠어.', '좋은 질문이야.']
  };
  /* 감정이 없는 말(대기)은 문장 모양을 보고 상황에 맞는 대답을 먼저 고른다 */
  var SITUATIONS = [
    [/안녕|하이|반가|헬로|좋은\s?아침/, ['안녕! 반가워.', '안녕, 오늘 어땠어?', '하이! 기다리고 있었어.']],
    [/잘\s?가|다음에\s?봐|바이|나중에\s?봐/, ['잘 가! 또 와.', '안녕, 다음에 또 얘기하자.', '바이바이!']],
    [/이름|누구야|넌\s?뭐|너는\s?뭐/, ['나는 작은 얼굴 친구야.', '나? 네 감정을 따라 하는 얼굴이야.']],
    [/배고|밥|먹었|먹을|맛집/, ['밥은 꼭 챙겨 먹어.', '맛있는 거 먹자!', '뭐 먹었어?']],
    [/\?$|까\s?$|니\s?$|나요?\s?$|어때|뭐야|왜|언제|어디|누가|어떻게/, ['글쎄, 잘 모르겠어.', '음, 너는 어떻게 생각해?', '좋은 질문이다.', '나도 궁금해.']]
  ];
  /* 대화 데이터에서 가장 비슷한 질문을 찾아 그 대답을 쓴다.
     데이터: songys/Chatbot_data (MIT, 질문-대답 11,823쌍) → chat_data.json
     방법: 글자 2개 묶음(bigram) TF-IDF 코사인 유사도. 0.6 이상일 때만 쓴다(그 아래는 엉뚱한 대답이 많음). */
  var CHAT = null, chatInv = null, chatNorm = null, chatIdf = null, CHAT_MIN = 0.6;
  function chatGrams(s){
    s = s.toLowerCase().replace(/[^가-힣a-z0-9]/g, '');

  exp.value = buildExport();
  document.getElementById('copy').addEventListener('click', function(){
    var m = document.getElementById('copyMsg');
    exp.focus(); exp.select();
    var ok = false;
    try { ok = document.execCommand && document.execCommand('copy'); } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(exp.value).then(function(){ m.textContent = '복사했습니다.'; }, function(){ m.textContent = '복사하지 못했습니다. 텍스트를 길게 눌러 직접 복사해 주세요.'; });
      return;
    }
    m.textContent = ok ? '복사했습니다.' : '복사하지 못했습니다. 텍스트를 길게 눌러 직접 복사해 주세요.';
  });
})();
</script>
</body>
</html>
